name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a previous in-flight run on the same ref when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every job runs on a GitHub-hosted runner, free for a public repository, on an image named by its version
  # (ubuntu-24.04, windows-2025) rather than a -latest label that moves on its own. Each job installs what it needs
  # with pinned versions: the Linux jobs apt-install clang-18 and its tools, the format job the clang-format wheel.
  # A hosted runner is a virtual machine whose CPU model varies from run to run, which is what the AVX2/BMI2 gate
  # in the build jobs is for.

  # Primary build + test on Linux, driven through the `make` wrapper — which invokes the CMake build, the
  # single build system of record. Builds the engine, tools and all eight test suites with warnings-as-errors
  # and runs them via ctest — including the bench determinism signature. (Exercising the wrapper also proves
  # the plain CMake path, so there is no separate cmake job; the Windows artifact job below runs CMake directly.)
  build-test:
    name: build + test (make wrapper)
    runs-on: ubuntu-24.04
    steps:
      # Full history and the tags (not a shallow clone): cmake/version.cmake derives the version from them.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang-18 cmake ninja-build
      - name: Check runner has AVX2 + BMI2
        # The engine emits AVX2 (NNUE) and BMI1/2 bit-scan instructions, so the test binaries need a CPU
        # that supports them. A hosted runner's CPU model is not fixed, so this gate is what stops a runner that
        # lacks them from reporting a green build it never actually ran.
        run: |
          grep -q avx2 /proc/cpuinfo && grep -q bmi2 /proc/cpuinfo \
            || { echo "::error::runner CPU lacks AVX2/BMI2 — cannot run the engine"; exit 1; }
      - name: Build + test
        run: make -j"$(nproc)" WERROR=1 CXX=clang++-18 check

  # Style gate: the whole tree must be clang-format-clean. clang-format is version-sensitive - a different
  # major restyles code that is already correct - so the version is pinned, and since 2026-09-26 it is pinned
  # to the same 22.1.8 across the whole organisation (see reckless-technology/claude-skills, skill
  # reckless-working-practice). It was 18 here until that day. Not apt: Ubuntu 24.04 carries no
  # clang-format-22, and the PyPI wheel is what the development machines run, so CI and a developer's
  # pre-commit hook agree. The wheel goes into a venv of the job's own, under the image's python3.
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: clang-format 22.1.8, from the PyPI wheel
        run: |
          venv="$RUNNER_TEMP/clang-format-venv"
          python3 -m venv "$venv"
          "$venv/bin/pip" install --quiet 'clang-format==22.1.8'
          echo "$venv/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: |
          clang-format --version
          clang-format --dry-run -Werror src/*.h src/*.cpp test/*.cpp tools/*.cpp

  # Coverage gate: every ctest on a build instrumented with clang's source-based coverage (the `coverage` target,
  # cmake/run_coverage.cmake), failing when src/'s line coverage is under PAWNSTAR_COVERAGE_MIN_LINES - one number,
  # set in CMakeLists.txt and read by `make coverage` / `tools\build.ps1 coverage` on a developer's machine too.
  # src/ is the engine and its UCI front end (every header and main.cpp); the developer tools under tools/ and the
  # tests are not measured. The LLVM tools must match the compiler that instrumented the build (a profile is
  # versioned), so this job installs clang-18 with llvm-18 from apt, whose llvm-profdata-18 and llvm-cov-18 the
  # coverage script finds beside clang++-18.
  coverage:
    name: coverage (src/ lines >= gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 cmake ninja-build
          clang++-18 --version | head -1
          llvm-cov-18 --version | grep -i version
      - name: Check runner has AVX2 + BMI2
        run: |
          grep -q avx2 /proc/cpuinfo && grep -q bmi2 /proc/cpuinfo \
            || { echo "::error::runner CPU lacks AVX2/BMI2 — cannot run the engine"; exit 1; }
      - name: Coverage (instrumented build, every ctest, the gate)
        run: |
          set -o pipefail
          make -j"$(nproc)" WERROR=1 CXX=clang++-18 coverage 2>&1 | tee coverage.log
      - name: Coverage table in the job summary
        if: always()
        run: |
          [ -f coverage.log ] || exit 0
          {
            echo '### src/ coverage'
            echo '```'
            sed -n '/^Filename /,/^TOTAL /p' coverage.log
            grep -E 'coverage: src/ lines|under the gate' coverage.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------------
  # Build artifacts: a native engine executable for Linux and Windows, uploaded only after that platform's
  # build AND test suite pass (the upload is a later step, so a failed build/test ends the job before it
  # runs). Each job is self-contained — it builds a release binary (DEBUGX counters off) and runs the full
  # suite on its own runner — so the uploaded binary is exactly the one that was tested. The executable is
  # version-named pawnstar_<major>_<minor>_<build> (the version comes from the git tags, hence the
  # full-history checkout). Download them from the run's "Artifacts" section, for a look at a commit's build;
  # releases are built by release.yml from nothing, on a pushed vMAJOR.MINOR tag, and signed - none of these
  # artifacts is released. No macOS job here: the macOS arm64 binary is built and tested in release.yml.
  # ---------------------------------------------------------------------------------------------------------

  # Linux x86-64 (clang, via the make wrapper → CMake).
  artifact-linux:
    name: artifact (linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang-18 cmake ninja-build
      - name: Check runner has AVX2 + BMI2
        run: |
          grep -q avx2 /proc/cpuinfo && grep -q bmi2 /proc/cpuinfo \
            || { echo "::error::runner CPU lacks AVX2/BMI2 — cannot run the engine"; exit 1; }
      - name: Build + test (release)
        run: make -j"$(nproc)" RELEASE=1 WERROR=1 CXX=clang++-18 check
      - name: Upload engine binary
        uses: actions/upload-artifact@v6
        with:
          name: pawnstar-linux-x86_64
          path: build/pawnstar_*
          if-no-files-found: error

  # Windows x86-64 (CMake + Ninja + clang, the CI-validated Windows path). The vcvars64 environment supplies
  # the MSVC STL/SDK that the MSVC-targeting clang links against, and Visual Studio's Ninja; the clang
  # is the image's standalone LLVM (C:\Program Files\LLVM, on its PATH), and its Git Bash runs the ctest `uci` test.
  artifact-windows:
    name: artifact (windows x86_64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # MSVC developer environment without the third-party msvc-dev-cmd action (whose latest release
      # still targets the deprecated Node 20): locate Visual Studio with vswhere, run vcvars64.bat,
      # and export the resulting environment to GITHUB_ENV — exactly what that action does internally.
      # Ninja needs no setup step either: the developer environment puts Visual Studio's on the PATH.
      - name: MSVC developer environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { Write-Error "Visual Studio with C++ tools not found"; exit 1 }
          cmd /s /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])"
            }
          }
      - name: Configure
        run: |
          clang++ --version
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPAWNSTAR_DEBUGX=OFF -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build
      # The engine imports system DLLs alone: the runtimes are linked statically, so it starts on a Windows with no
      # Visual C++ redistributable. A C or C++ runtime DLL among its imports fails the job.
      - name: Windows DLLs the engine imports
        shell: pwsh
        run: |
          $binary = Get-ChildItem build\pawnstar_*.exe | Select-Object -First 1
          if (-not $binary) { throw "the engine was not built" }
          pwsh -NoProfile -File tools/windows-dependents.ps1 $binary.FullName
          if ($LASTEXITCODE -ne 0) { throw "the engine imports a DLL outside the allowlist" }
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Upload engine binary
        uses: actions/upload-artifact@v6
        with:
          name: pawnstar-windows-x86_64
          path: build/pawnstar_*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------------------
  # The SHARED NNUE SHAPE — horizontal king mirroring plus 8 material output heads — which every job above
  # leaves entirely untested, because the shape is behind a build knob that defaults off and they all
  # exercise the default. That path is about to carry a freshly trained net the whole project depends on, and
  # a gated path with no CI rots silently: pawnstar-go's transposition table defaulted to 512 MB against this
  # port's 64 MB from May until 2026-10-27, through every release, because the only cross-port gate that ran
  # was `bench` and `bench` pins the table to 64 MB in all three. A gate that controls for a difference cannot
  # detect it.
  #
  # Its own job rather than a matrix dimension on build-test, for three reasons. The default shape's node
  # counts, its coverage percentage and its uploaded artifacts must not move, and a matrix would recompute all
  # of them; the two shapes' failures stay distinguishable at a glance, where a matrix leg reads as "the
  # build broke"; and the job runs concurrently with the others, so it adds a name to the list rather than
  # minutes to the critical path. Linux only: the shape is compile-time integer arithmetic, the synthetic net
  # is proven byte-identical across platforms (and the script asserts its SHA-256 every run), so a Windows
  # and a macOS leg would triple the cost for no new failure mode.
  # ---------------------------------------------------------------------------------------------------------
  new-shape:
    name: new NNUE shape (mirroring + 8 output heads)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang-18 cmake ninja-build
      - name: Check runner has AVX2 + BMI2
        run: |
          grep -q avx2 /proc/cpuinfo && grep -q bmi2 /proc/cpuinfo \
            || { echo "::error::runner CPU lacks AVX2/BMI2 — cannot run the engine"; exit 1; }
      # A build tree of its own, and the knobs passed explicitly even though this is the DEFAULT shape
      # since release 2.0.0: naming them is what keeps this job a statement about the shape rather than
      # about whatever the default happens to be, so it would still be this shape's gate if the default
      # moved again.
      #
      # CTEST_ARGS is left at the Makefile's default `-V`, which streams each suite's own output, rather
      # than cut down to --output-on-failure: a suite that SKIPS says so and why, and a skip nobody can
      # read in the log is the invisible skip this job was built to avoid.
      - name: Build + test at the shared shape
        run: |
          set -o pipefail
          make -j"$(nproc)" BUILD_DIR=build-new-shape KING_MIRRORING=1 OUTPUT_BUCKETS=8 WERROR=1 \
               CXX=clang++-18 check 2>&1 | tee new-shape-check.log
      # The synthetic net the two steps below read. CMake's `synthetic_net` target builds it only when the
      # shipped net is NOT this build's shape, which it now is, so at this shape the suites are handed the
      # shipped net and nothing writes the fixture: write it here, from the same generator, explicitly.
      - name: Write the synthetic fixture net
        run: build-new-shape/test_nnue_incremental --write-synthetic-net build-new-shape/synthetic-net.bin
      # The skip and run decisions, where a reader will look for them: which suites this shape could not
      # carry across, and which were handed the synthetic net and really ran.
      - name: What the suite did at this shape, in the job summary
        if: always()
        run: |
          [ -f new-shape-check.log ] || exit 0
          {
            echo '### The shared NNUE shape: what each suite did'
            echo '```'
            grep -E "is not this build's NNUE shape|uci: skipped|synthetic net at this build's shape" \
                 new-shape-check.log || echo '(no skip lines - every suite ran)'
            sed -n '/tests passed/p' new-shape-check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # THE MATCH HARNESS READS A HEADER CORRECTLY. tools/pawnstar-match.sh runs the preflight that proves
      # the right net actually loaded before a multi-hour SPRT, and until 2026-10-28 it lived only on the CI
      # runners, in no repository, with a decoder of its own. That decoder read the header's uint16 fields
      # from byte offset 4 when the RNNUE1 magic is 8 bytes, so every label was two fields out: it printed
      # `buckets2` for this 8-king-bucket net and the real bucket count surfaced under the `qb` label. No
      # match result was ever wrong — the engine validates independently — but a verification tool printing
      # confident wrong values is worse than one printing nothing, and nothing here would have noticed.
      #
      # So this step is that missing check: decode the deterministic synthetic net (SHA-256 pinned by the
      # signature step below) through the harness's own `--print-header` path and assert every field. The
      # harness no longer decodes anything itself — it parses tools/print_net_header's key=value output —
      # and running it through the harness rather than calling the tool directly means a harness that reads
      # the WRONG KEY fails here too, which is the shape the original bug actually had.
      #
      # `king_buckets=8` is the assertion the old decoder would have failed (it read 2 there). Every other
      # field is asserted beside it, including both CRC-64s: every one of them is fully determined by this
      # build's shape and the pinned fixture, so a value that moves is either a real shape change or a
      # drifted reader, and both want a red job.
      - name: The match harness decodes the fixture net's header (king_buckets is 8)
        run: |
          set -o pipefail
          # `|| harness_status=$?` rather than a bare call: the job's shell is `bash -e`, so a non-zero exit
          # would end the step before a single field had been compared — and a not-intact fixture is exactly
          # the run whose fields are worth printing.
          harness_status=0
          tools/pawnstar-match.sh --print-header build-new-shape/synthetic-net.bin \
              --print-net-header build-new-shape/print_net_header > harness-header.log || harness_status=$?
          cat harness-header.log
          failures=0
          while IFS= read -r expected; do
            case "$expected" in ''|'#'*) continue ;; esac
            if grep -Fxq -- "$expected" harness-header.log; then
              printf 'ok     %s\n' "$expected"
            else
              printf '::error::expected `%s`, the harness printed `%s`\n' "$expected" \
                     "$(grep -E "^${expected%%=*}=" harness-header.log | head -1)"
              failures=$((failures + 1))
            fi
          done <<'EXPECTED'
          # The file itself, and the container.
          file_bytes=12617824
          header_complete=yes
          magic=RNNUE1\x00\x00
          magic_ok=yes
          # The architecture. These ARE the shared shape: mirroring on with eight material output heads.
          format_version=2
          header_bytes=64
          features_per_bucket=768
          king_buckets=8
          hidden_size=1024
          output_buckets=8
          flags=0x01
          king_mirroring=on
          flags_unknown_bits=0x00
          activation=0
          activation_name=screlu
          qa=255
          qb=64
          eval_scale=400
          reserved_zero=yes
          king_bucket_map_crc=0x0A20060D4E9586E0
          # Integrity: the payload's length and both CRC-64s, computed against the file and found equal.
          payload_bytes=12617760
          payload_crc=0xE6F3FB70D96D876A
          header_crc=0x7B18813893FDE2D9
          header_crc_computed=0x7B18813893FDE2D9
          header_crc_ok=yes
          actual_payload_bytes=12617760
          payload_size_ok=yes
          payload_crc_computed=0xE6F3FB70D96D876A
          payload_crc_ok=yes
          payload_bytes_from_fields=12617760
          payload_bytes_from_fields_ok=yes
          integrity=ok
          # This job builds AT the fixture's shape, so the net is this build's own and would load here.
          shape_matches_build=yes
          shape_mismatches=
          # The harness's own two lines, built by it from the keys above: a harness that reads the wrong key
          # decodes a correct report into a wrong summary, which is exactly what the old bug did.
          description=magic=RNNUE1\x00\x00 v2/hdr64/feat768/kb8/hidden1024/ob8/flags0x01/act0/qa255/qb64/scale400/mapcrc=0x0A20060D4E9586E0
          shape_signature=format_version=2 header_bytes=64 features_per_bucket=768 king_buckets=8 hidden_size=1024 output_buckets=8 flags=0x01 activation=0 qa=255 qb=64 eval_scale=400 king_bucket_map_crc=0x0A20060D4E9586E0
          EXPECTED
          if [ "$harness_status" -ne 0 ]; then
            echo "::error::pawnstar-match.sh --print-header exited $harness_status (expected 0: the fixture is intact)"
            failures=$((failures + 1))
          fi
          [ "$failures" -eq 0 ] \
            || { echo "::error::$failures header assertion(s) failed — the harness is misreading RNNUE1"; exit 1; }
          echo "Every RNNUE1 header field read back as expected."
      - name: The busy-runner gate counts worker PROCESSES, not mentions of them
        run: |
          set -o pipefail
          # Until this change the gate read `ps -e -o args=` and grepped for `[R]unner\.Worker`, so it counted
          # any process whose COMMAND LINE mentioned the worker rather than the worker itself. On 2026-10-28
          # that refused a match on a demonstrably idle machine: the operator's own per-minute sampler and a
          # log monitor each carried the string in their argv, so the gate reported three running jobs while
          # 54 samples, both runners' `_work` trees and the newest `Worker_*.log` all agreed nothing had run
          # for two days. It fails safe, refusing rather than contending, but it cost a launch — and the
          # `[R]unner` bracket form guards only that grep against matching itself, never other watchers.
          #
          # PAWNSTAR_PROCESS_LISTER substitutes a known process list for `ps`, so these cases are the before
          # and after of that incident. Full command lines that MENTION the worker must read idle; a process
          # name that IS the worker must refuse. The gate sits before the engine probe, so the refusing case
          # exits there and needs no engine, while the idle cases walk on and fail later — which is why they
          # assert on the note rather than on the exit status.
          printf '%s\n' \
            'bash /home/jonny/sprt/arm1_runner_sample.sh pgrep -x Runner.Worker' \
            'tail -f /home/jonny/sprt/logs/Runner.Worker.log' \
            'ssh -4 jonny@192.168.50.22 pgrep -x Runner.Worker' > argv-style-mentions.txt
          printf '%s\n' bash grep ps sshd > names-idle.txt
          printf '%s\n' bash Runner.Worker grep > names-busy.txt

          harness() {
            PAWNSTAR_PROCESS_LISTER="cat $1" FASTCHESS=/bin/true \
            tools/pawnstar-match.sh --dry-run --allow-same-net \
              --candidate build-new-shape/synthetic-net.bin \
              --baseline  build-new-shape/synthetic-net.bin \
              --candidate-binary build-new-shape/pawnstar \
              --baseline-binary  build-new-shape/pawnstar \
              --print-net-header build-new-shape/print_net_header \
              --repo . 2>&1
          }

          failures=0
          out=$(harness argv-style-mentions.txt || true)
          if printf '%s' "$out" | grep -Fq 'Actions runner: idle.'; then
            echo 'ok     command lines MENTIONING the worker read as idle (the old gate counted three)'
          else
            echo '::error::command lines mentioning Runner.Worker counted as running jobs - the argv bug is back'
            echo "$out" | head -30
            failures=$((failures + 1))
          fi

          out=$(harness names-idle.txt || true)
          if printf '%s' "$out" | grep -Fq 'Actions runner: idle.'; then
            echo 'ok     a process list without the worker reads as idle'
          else
            echo '::error::an idle process list did not read as idle'
            failures=$((failures + 1))
          fi

          status=0
          out=$(harness names-busy.txt) || status=$?
          if [ "$status" -ne 0 ] && printf '%s' "$out" | grep -Fq 'GitHub Actions job(s) are running on this machine'; then
            echo 'ok     a real worker process name still refuses the match'
          else
            echo "::error::a running worker was NOT detected (exit $status) - the gate no longer protects a job"
            echo "$out" | head -30
            failures=$((failures + 1))
          fi

          status=0
          out=$(harness /nonexistent/process-list) || status=$?
          if [ "$status" -ne 0 ] && printf '%s' "$out" | grep -Fq 'could not list processes'; then
            echo 'ok     a process list that cannot be read refuses, rather than reading as idle'
          else
            echo "::error::an unreadable process list did not refuse (exit $status) - a broken check reporting clean is worse than none"
            failures=$((failures + 1))
          fi

          [ "$failures" -eq 0 ] \
            || { echo "::error::$failures busy-runner gate assertion(s) failed"; exit 1; }
          echo 'The busy-runner gate counts processes, not mentions of them.'
      - name: The harness's header report in the job summary
        if: always()
        run: |
          [ -f harness-header.log ] || exit 0
          {
            echo '### The match harness reading the fixture net'
            echo '```'
            cat harness-header.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The cross-port gate. `--hash` is mandatory in the script and its value is printed beside every node
      # count: table size changes the collision pattern and so the node count at a fixed depth, so a node
      # count with no table size next to it is not comparable — and it was precisely the absence of one that
      # hid the 512-vs-64 default. The script asserts the synthetic net's size, SHA-256 and RNNUE1 header
      # BEFORE searching it, so a drifted generator fails as a drifted generator rather than as a search
      # regression. The same file, with the same six expected results, is committed in pawnstar-rs and
      # pawnstar-go: three independent assertions against one shared constant, so any port that drifts fails
      # its own CI at its own commit, with no cross-repository artifact fetch to go stale.
      - name: Cross-port node-count signature (six positions, depth 8, Hash 64 MB)
        run: |
          set -o pipefail
          tools/new-shape-signature.sh --hash 64 --net build-new-shape/synthetic-net.bin --depth 8 \
              build-new-shape/pawnstar 2>&1 | tee new-shape-signature.log
      - name: Signature in the job summary
        if: always()
        run: |
          [ -f new-shape-signature.log ] || exit 0
          {
            echo '### The shared NNUE shape: cross-port node-count signature'
            echo '```'
            cat new-shape-signature.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # THE OTHER SHAPE MUST STILL BUILD, and nothing else in CI exercises it now that the shared shape is
      # the default. That is not a hypothetical: flipping the default on 2026-10-30 broke this path the same
      # day. `CMakeLists.txt` added `PAWNSTAR_NNUE_KING_MIRRORING=1` in its `ON` branch and defined nothing
      # in the `OFF` one, which was right while `src/nnue.h` defaulted the macro to 0 - and with that
      # default now 1, `KING_MIRRORING=0` left the header's value in force and built a MIRRORED engine with
      # one output head, a shape that exists nowhere. It stamped `format_version` 2 over a 12,589,060-byte
      # payload and `test_net_header` is what reported it.
      #
      # So this step is cheap and targeted rather than a second full `make check`: the two suites that
      # actually read the shape. `net_header` decodes the synthetic net written at this build's own shape
      # and asserts every architecture field and both CRC-64s against literals, which is what catches a
      # mixed shape; `nnue_incremental` searches it, which is what catches a mirror-refresh defect. The
      # suites whose expected values are the shipped net's skip here by design - the shipped net is of the
      # other shape and the engine rightly refuses it.
      #
      # The other reason it is targeted: `principal_variation` searches the SYNTHETIC net to depth 8, and
      # random weights give the pruning heuristics no traction. Sixteen of the seventeen suites pass at
      # this shape in about 20 seconds; that one had not finished in five minutes when measured locally on
      # 2026-10-30. It is the weights rather than the shape - this file records the same effect for a
      # depth-12 search above - but a full `make check` here would be an open-ended job.
      - name: The retired v12 shape still builds and reads its own net
        run: |
          set -o pipefail
          cmake -S . -B build-v12-shape -G Ninja -DCMAKE_CXX_COMPILER=clang++-18 -DWERROR=ON \
                -DPAWNSTAR_NNUE_KING_MIRRORING=OFF -DPAWNSTAR_NNUE_OUTPUT_BUCKETS=1
          cmake --build build-v12-shape --parallel --target test_net_header test_nnue_incremental synthetic_net
          ctest --test-dir build-v12-shape -V -R '^(net_header|nnue_incremental)$' 2>&1 \
              | tee v12-shape-check.log

  # The single required check for the branch ruleset. `main` takes pull requests and requires this one context,
  # so the jobs above can be renamed, split or added to without editing the ruleset on the server. `if: always()`
  # runs it even when a dependency failed, was skipped or was cancelled, and it is green only when every one of
  # them succeeded — anything other than success fails it, naming the jobs that were not green.
  ci:
    name: CI
    needs: [build-test, format, coverage, new-shape, artifact-linux, artifact-windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: >-
            build-test=${{ needs.build-test.result }} format=${{ needs.format.result }}
            coverage=${{ needs.coverage.result }} new-shape=${{ needs.new-shape.result }}
            artifact-linux=${{ needs.artifact-linux.result }}
            artifact-windows=${{ needs.artifact-windows.result }}
        run: |
          failed=""
          for result in $RESULTS; do
            echo "$result"
            [ "${result#*=}" = success ] || failed="$failed ${result%%=*}"
          done
          [ -z "$failed" ] || { echo "::error::not green:$failed"; exit 1; }
          echo "Green."
