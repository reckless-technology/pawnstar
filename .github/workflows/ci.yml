name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a previous in-flight run on the same ref when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Primary build + test on Linux, driven through the `make` wrapper — which invokes the CMake build, the
  # single build system of record. Builds the engine, tools and all eight test suites with warnings-as-errors
  # and runs them via ctest — including the bench determinism signature. (Exercising the wrapper also proves
  # the plain CMake path, so there is no separate cmake job; the Windows artifact job below runs CMake directly.)
  build-test:
    name: build + test (make wrapper)
    runs-on: ubuntu-latest
    steps:
      # Full history (not a shallow clone) so `git rev-list --count HEAD` yields the true build number.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang-18 cmake ninja-build
      - name: Check runner has AVX2 + BMI2
        # The engine emits AVX2 (NNUE) and BMI1/2 bit-scan instructions, so the test binaries need a CPU
        # that supports them. GitHub-hosted runners do; fail fast with a clear message if one ever doesn't.
        run: |
          grep -q avx2 /proc/cpuinfo && grep -q bmi2 /proc/cpuinfo \
            || { echo "::error::runner CPU lacks AVX2/BMI2 — cannot run the engine"; exit 1; }
      - name: Build + test
        run: make -j"$(nproc)" WERROR=1 CXX=clang++-18 check

  # Style gate: the whole tree must be clang-format-clean (clang-format is version-sensitive, so pin 18 to
  # match the project's local clang-format-18).
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: clang-format-18 --dry-run -Werror src/*.h src/*.cpp test/*.cpp tools/*.cpp

  # ---------------------------------------------------------------------------------------------------------
  # Build artifacts: a native engine executable for Linux and Windows, uploaded only after that platform's
  # build AND test suite pass (the upload is a later step, so a failed build/test ends the job before it
  # runs). Each job is self-contained — it builds a release binary (DEBUGX counters off) and runs the full
  # suite on its own runner — so the uploaded binary is exactly the one that was tested. The executable is
  # version-named pawnstar_<major>_<minor>_<build> (the build number is the git commit count, hence the
  # full-history checkout). Download them from the run's "Artifacts" section. No macOS job here: a hosted
  # macOS minute bills ten Linux minutes on a private repo, so the macOS arm64 binary is built and tested at
  # release time instead (release.yml), at the promoted commit, and the release refuses to publish if it fails.
  # ---------------------------------------------------------------------------------------------------------

  # Linux x86-64 (clang, via the make wrapper → CMake).
  artifact-linux:
    name: artifact (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang-18 cmake ninja-build
      - name: Check runner has AVX2 + BMI2
        run: |
          grep -q avx2 /proc/cpuinfo && grep -q bmi2 /proc/cpuinfo \
            || { echo "::error::runner CPU lacks AVX2/BMI2 — cannot run the engine"; exit 1; }
      - name: Build + test (release)
        run: make -j"$(nproc)" RELEASE=1 WERROR=1 CXX=clang++-18 check
      - name: Upload engine binary
        uses: actions/upload-artifact@v6
        with:
          name: pawnstar-linux-x86_64
          path: build/pawnstar_*
          if-no-files-found: error

  # Windows x86-64 (CMake + Ninja + clang, the CI-validated Windows path). The vcvars64 environment supplies
  # the MSVC STL/SDK that the VS-targeting clang links against; Git Bash (preinstalled) runs the ctest `uci` test.
  artifact-windows:
    name: artifact (windows x86_64)
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # MSVC developer environment without the third-party msvc-dev-cmd action (whose latest release
      # still targets the deprecated Node 20): locate Visual Studio with vswhere, run vcvars64.bat,
      # and export the resulting environment to GITHUB_ENV — exactly what that action does internally.
      # Ninja needs no setup step either: it is preinstalled on the self-hosted runner reckless-ci-win-0.
      - name: MSVC developer environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { Write-Error "Visual Studio with C++ tools not found"; exit 1 }
          cmd /s /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])"
            }
          }
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPAWNSTAR_DEBUGX=OFF -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Upload engine binary
        uses: actions/upload-artifact@v6
        with:
          name: pawnstar-windows-x86_64
          path: build/pawnstar_*.exe
          if-no-files-found: error
