name: Match

# A long engine-versus-engine match, played on GitHub-hosted runners instead of on lin-0 (the organization's one
# self-hosted Linux machine, which is also where the hand-run matches used to go - and while one ran there, no
# private repository could push without biasing it). Manual only: nothing here runs on a push or a pull request.
#
# This file is the FIRST CALLER of the reusable workflow match-core.yml, and holds only what is Pawnstar's:
#
#   refs   -> resolves the two refs to commits (the baseline defaults to the newest vMAJOR.MINOR.PATCH tag)
#   build  -> builds both engines (clang-18, release) and gathers them, both nets, the opening set and a
#             manifest.json into ONE artifact, `match-inputs`
#   match  -> `uses: ./.github/workflows/match-core.yml`: fastchess, the plan, the chunk matrix, the pool. Pawnstar's
#             own RNNUE1 net preflight (tools/pawnstar-match.sh --dry-run) is passed as that workflow's `preflight`.
#
# Another engine's repository does the same with its own build job. docs/match-core.md is the guide: the inputs, the
# manifest format, and an example caller pinned to a commit. A workflow_dispatch workflow cannot be dispatched until
# its file is on the default branch, so edits are dispatched from their own branch with
# `gh workflow run match.yml --ref <branch>`.
#
# Capacity: the organization is on GitHub's Team plan, so every public repository's CI shares about 60 concurrent
# hosted jobs; match-core.yml keeps max-parallel at 40. GitHub's Actions terms allow use for testing the
# repository's own project, which strength-testing Pawnstar is.

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: 'Candidate: branch, tag or commit'
        default: 'main'
      baseline_ref:
        description: 'Baseline: branch, tag or commit (empty = the newest vMAJOR.MINOR.PATCH tag)'
        default: ''
      candidate_net_url:
        description: 'Candidate net URL (empty = the net the candidate ref ships, nnue/pawnstar-v20.bin)'
        default: ''
      candidate_net_sha256:
        description: 'SHA-256 of the candidate net (required with a URL)'
        default: ''
      baseline_net_url:
        description: 'Baseline net URL (empty = the net the baseline ref ships)'
        default: ''
      baseline_net_sha256:
        description: 'SHA-256 of the baseline net (required with a URL)'
        default: ''
      time_control:
        description: 'Time control, e.g. 8+0.08 (ignored when a depth is given)'
        default: '8+0.08'
      baseline_time_control:
        description: 'Time-odds match: the baseline plays this time control instead (e.g. 4+0.04 against 8+0.08). Empty = the same clock'
        default: ''
      depth:
        description: 'Fixed search depth instead of a time control (empty = use the time control)'
        default: ''
      games:
        description: 'Total games (rounded up to whole color-reversed pairs; at most 2 x the openings left)'
        default: '4000'
      chunks:
        description: 'Number of chunk jobs'
        default: '20'
      concurrency:
        description: 'Games at once per chunk job (a comma list is dealt out round-robin to the chunks)'
        default: '2'
      hash_mb:
        description: 'Transposition table per engine, MB'
        default: '64'
      first_opening:
        description: 'First position of nnue/openings.epd to play (1-based; the chunks take consecutive slices)'
        default: '1'

permissions:
  contents: read

jobs:
  refs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.refs.outputs.candidate_sha }}
      baseline_sha: ${{ steps.refs.outputs.baseline_sha }}
      baseline_ref: ${{ steps.refs.outputs.baseline_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve the refs
        id: refs
        env:
          IN_CANDIDATE: ${{ inputs.candidate_ref || 'main' }}
          IN_BASELINE: ${{ inputs.baseline_ref }}
        run: |
          python3 - <<'PY'
          import os, subprocess

          def sh(*args):
              return subprocess.run(args, check=True, capture_output=True, text=True).stdout.strip()

          env = os.environ
          # Resolved to commits here, once, so every job builds exactly what this named.
          sh("git", "fetch", "--tags", "--force", "origin", "+refs/heads/*:refs/remotes/origin/*")
          def resolve(ref):
              for candidate in (ref, "origin/" + ref):
                  try:
                      return sh("git", "rev-parse", "--verify", candidate + "^{commit}")
                  except subprocess.CalledProcessError:
                      continue
              raise SystemExit(f"::error::cannot resolve '{ref}'")
          baseline = env["IN_BASELINE"].strip()
          if not baseline:
              tags = sh("git", "tag", "--list", "v[0-9]*.[0-9]*.[0-9]*", "--sort=-v:refname").splitlines()
              baseline = tags[0]
          candidate_sha, baseline_sha = resolve(env["IN_CANDIDATE"]), resolve(baseline)
          print(f"candidate {env['IN_CANDIDATE']} = {candidate_sha}")
          print(f"baseline  {baseline} = {baseline_sha}")
          with open(env["GITHUB_OUTPUT"], "a") as out:
              out.write(f"candidate_sha={candidate_sha}\nbaseline_sha={baseline_sha}\nbaseline_ref={baseline}\n")
          PY

  build:
    needs: refs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: The workflow's own tree (the opening set)
        uses: actions/checkout@v5
        with:
          path: wf
      - name: Candidate checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.refs.outputs.candidate_sha }}
          fetch-depth: 0
          path: candidate-src
      - name: Baseline checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.refs.outputs.baseline_sha }}
          fetch-depth: 0
          path: baseline-src
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang-18 cmake ninja-build
      - name: Check runner has AVX2 + BMI2
        run: |
          grep -q avx2 /proc/cpuinfo && grep -q bmi2 /proc/cpuinfo \
            || { echo "::error::runner CPU lacks AVX2/BMI2 — cannot run the engine"; exit 1; }
      - name: Build the candidate (engine and print_net_header)
        run: |
          cd candidate-src
          make -j"$(nproc)" RELEASE=1 CXX=clang++-18
          cmake --build build --parallel --target print_net_header
      - name: Build the baseline (engine)
        run: |
          cd baseline-src
          make -j"$(nproc)" RELEASE=1 CXX=clang++-18
      - name: Gather the match inputs and write the manifest
        env:
          CANDIDATE_URL: ${{ inputs.candidate_net_url }}
          CANDIDATE_SHA256: ${{ inputs.candidate_net_sha256 }}
          BASELINE_URL: ${{ inputs.baseline_net_url }}
          BASELINE_SHA256: ${{ inputs.baseline_net_sha256 }}
          CANDIDATE_COMMIT: ${{ needs.refs.outputs.candidate_sha }}
          BASELINE_COMMIT: ${{ needs.refs.outputs.baseline_sha }}
          BASELINE_REF: ${{ needs.refs.outputs.baseline_ref }}
        run: |
          set -euo pipefail
          mkdir -p inputs/candidate inputs/baseline
          cp -L candidate-src/build/pawnstar inputs/candidate/pawnstar
          cp -L candidate-src/build/print_net_header inputs/candidate/print_net_header
          cp -L baseline-src/build/pawnstar inputs/baseline/pawnstar
          cp wf/nnue/openings.epd inputs/openings.epd

          fetch_net() {   # <name> <url> <sha256> <the net the ref ships>
            if [ -n "$2" ]; then
              [ -n "$3" ] || { echo "::error::$1 net URL given without a SHA-256"; exit 1; }
              curl -fsSL --retry 3 -o "inputs/$1.bin" "$2"
              echo "$3  inputs/$1.bin" | sha256sum -c - || { echo "::error::$1 net does not match the SHA-256 given"; exit 1; }
            else
              cp "$4" "inputs/$1.bin"
            fi
          }
          fetch_net candidate "$CANDIDATE_URL" "$CANDIDATE_SHA256" candidate-src/nnue/pawnstar-v20.bin
          fetch_net baseline  "$BASELINE_URL"  "$BASELINE_SHA256"  baseline-src/nnue/pawnstar-v20.bin
          chmod +x inputs/*/pawnstar inputs/candidate/print_net_header

          # The manifest tools/match_core.py reads (docs/match-core.md). Each side gets its net at STARTUP through
          # PAWNSTAR_EVALFILE (so a variant binary survives the handshake) and as the EvalFile option, and is pinned
          # to one search thread; OwnBook is off for both, since the engine's book move is weighted-random.
          python3 - <<'PY'
          import hashlib, json, os
          def side(role, commit, label):
              net = "{inputs}/%s.bin" % role
              return {"name": f"{label} {commit[:8]}",
                      "command": "{inputs}/%s/pawnstar" % role,
                      "options": {"EvalFile": net},
                      "env": {"PAWNSTAR_EVALFILE": net, "PAWNSTAR_THREADS": "1"}}
          env = os.environ
          manifest = {
              "format": 1,
              "candidate": side("candidate", env["CANDIDATE_COMMIT"], "candidate"),
              "baseline": side("baseline", env["BASELINE_COMMIT"], env["BASELINE_REF"]),
              "each_options": {"OwnBook": "false"},
              "openings": {"path": "openings.epd",
                           "sha256": hashlib.sha256(open("inputs/openings.epd", "rb").read()).hexdigest()},
              "notes": [f"candidate commit {env['CANDIDATE_COMMIT']}",
                        f"baseline {env['BASELINE_REF']} commit {env['BASELINE_COMMIT']}",
                        f"workflow commit ${{ github.sha }}"],
          }
          json.dump(manifest, open("inputs/manifest.json", "w"), indent=2)
          PY
          {
            echo "candidate_commit  $CANDIDATE_COMMIT"
            echo "baseline_commit   $BASELINE_COMMIT ($BASELINE_REF)"
            echo "workflow_commit   ${{ github.sha }}"
            (cd inputs && sha256sum candidate.bin baseline.bin openings.epd candidate/pawnstar baseline/pawnstar)
          } | tee inputs/manifest.txt
          {
            echo '### Match inputs'
            echo '```'
            cat inputs/manifest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: match-inputs
          path: inputs
          retention-days: 14
          if-no-files-found: error

  match:
    needs: [refs, build]
    uses: ./.github/workflows/match-core.yml
    with:
      artifact: match-inputs
      title: 'Match: ${{ needs.refs.outputs.candidate_sha }} (candidate) vs ${{ needs.refs.outputs.baseline_ref }} ${{ needs.refs.outputs.baseline_sha }} (baseline)'
      time_control: ${{ inputs.time_control || '8+0.08' }}
      baseline_time_control: ${{ inputs.baseline_time_control }}
      depth: ${{ inputs.depth }}
      games: ${{ inputs.games || '4000' }}
      chunks: ${{ inputs.chunks || '20' }}
      concurrency: ${{ inputs.concurrency || '2' }}
      hash_mb: ${{ inputs.hash_mb || '64' }}
      first_opening: ${{ inputs.first_opening || '1' }}
      # Pawnstar's own protection, which a generic engine start-and-search probe cannot give: the RNNUE1 header of
      # each net decoded by the candidate build's own print_net_header (integrity, shape, both nets distinct) and a
      # depth-4 search that makes each binary load its own net for real. --dry-run plays nothing.
      preflight: |
        "$MATCH_TOOLS/pawnstar-match.sh" --repo "$MATCH_INPUTS" \
          --candidate candidate.bin --baseline baseline.bin \
          --candidate-binary candidate/pawnstar --baseline-binary baseline/pawnstar \
          --openings openings.epd --games 2 $MATCH_CLOCK_ARGS \
          --log-dir "${RUNNER_TEMP:-/tmp}/preflight" --label preflight --allow-busy-runner --dry-run
